<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid-practice</title>
    <style>
      .container {
        display: grid;
        grid-template-rows: 1fr 3fr 1fr;
        height: 500px; 
        width: 500px;
        background-color: skyblue; 
        padding: 10px;

      }
      .header {
        background-color: #90ee90;
        padding: 10px;
        margin: 3px;
        padding: 5px;
        text-align: center;

      }
      .body {
        display: grid;
        grid-template-columns: 1fr 3fr;
        padding: 5px;
      }

      .footer {
        background-color: #90ee90;
        padding: 10px;
        margin: 3px;
        padding: 5px;
        text-align: center; 
      }
      .aside {
        background-color: #2e8b57;
        margin: 3px;
         text-align: center;
      }
      .article {
        background-color: #ffa600;
        display: grid;
        grid-template-rows: 1fr 1fr 1fr;
        margin: 3px;
         text-align: center;
      }
      .image {
        background-color: #ffde21;
        margin: auto;
        width: 100px;
        height: 100px;
        text-align: center;
        
      }
      .box{
        display:grid;
        grid-template-columns: 1fr 1fr 1fr;
        
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Header</div>
      <div class="body">
        <div class="aside">Aside</div>
        <div class="article">
          Article
          <div class="box">
            <div class="image">image</div>
            <div class="image">image</div>
            <div class="image">image</div>
          </div>
        </div>
      </div>
      <div class="footer">Footer</div>
    </div>
  </body>
</html>
